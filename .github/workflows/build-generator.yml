name: build-generator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Public context checks, local unqualified build, or reviewed GHCR publication
        type: choice
        options: [checks, build, publish]
        default: checks

permissions:
  contents: read

concurrency:
  group: harmony-public-generator
  cancel-in-progress: false

jobs:
  generator:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'fvlvte/harmony-studio-projects' && github.ref == 'refs/heads/main' && inputs.mode != 'publish' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      GENERATOR_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Refuse unsupported dispatch mode before any build
        run: |
          case "$GENERATOR_MODE" in checks|build) ;; *) exit 78 ;; esac
      - name: Check the exact public context and immutable ARM64 base
        run: |
          python3 -I -B -W error tools/generator_toolchain.py --phase check
      - name: Keyless public regression suite including generator controls
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=15s 120s \
            env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            python3 -I -B -W error -c \
            "import pathlib,sys,unittest; sys.path.insert(0,str(pathlib.Path.cwd())); suite=unittest.defaultTestLoader.discover('tests'); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(0 if result.wasSuccessful() else 1)" \
            > "$RUNNER_TEMP/generator-public-tests.private.log" 2>&1
      - name: Build a local runner image using only the public context
        if: ${{ inputs.mode == 'build' }}
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -m)" = aarch64
          case_dir=$(mktemp -d "$RUNNER_TEMP/public-generator.XXXXXXXX")
          mkdir -m 700 "$case_dir/docker"
          printf '{}\n' > "$case_dir/docker/config.json"
          chmod 600 "$case_dir/docker/config.json"
          timeout --signal=TERM --kill-after=30s 900s \
            env -i PATH=/usr/bin:/bin LANG=C.UTF-8 DOCKER_CONFIG="$case_dir/docker" \
            docker build --platform linux/arm64 --network default \
              --file tools/generator-context/Dockerfile --tag harmony-public-generator:unqualified \
              tools/generator-context > "$case_dir/build.private.log" 2>&1
          printf 'LOCAL_PUBLIC_GENERATOR_IMAGE_BUILT_NOT_QUALIFIED\n'
      - name: Probe actual public generator identity and owned container closure
        id: probe
        if: ${{ success() && inputs.mode == 'build' }}
        run: >-
          python3 -I -B -W error tools/generator_toolchain.py --phase probe
      - name: Public typed identity receipt only
        if: ${{ success() && inputs.mode == 'build' && steps.probe.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-generator-identity-${{ github.run_id }}
          path: .generator-public/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      # No SDK decryption, registry login/push, source or raw log upload.
      # Actual image identity, toolchain provenance, lifecycle and later public
      # publication require separate owner qualification and authorization.

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'fvlvte/harmony-studio-projects' && github.ref == 'refs/heads/main' && inputs.mode == 'publish' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      GENERATOR_MODE: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Refuse unsupported dispatch mode before any build
        run: |
          case "$GENERATOR_MODE" in publish) ;; *) exit 78 ;; esac
      - name: Check the exact public context and immutable ARM64 base
        run: |
          python3 -I -B -W error tools/generator_toolchain.py --phase check
      - name: Keyless public regression suite including generator controls
        run: |
          set -euo pipefail
          umask 077
          timeout --signal=TERM --kill-after=15s 120s \
            env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            python3 -I -B -W error -c \
            "import pathlib,sys,unittest; sys.path.insert(0,str(pathlib.Path.cwd())); suite=unittest.defaultTestLoader.discover('tests'); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(0 if result.wasSuccessful() else 1)" \
            > "$RUNNER_TEMP/generator-public-tests.private.log" 2>&1
      - name: Build a local runner image using only the public context
        if: ${{ success() }}
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -m)" = aarch64
          case_dir=$(mktemp -d "$RUNNER_TEMP/public-generator.XXXXXXXX")
          mkdir -m 700 "$case_dir/docker"
          printf '{}\n' > "$case_dir/docker/config.json"
          chmod 600 "$case_dir/docker/config.json"
          timeout --signal=TERM --kill-after=30s 900s \
            env -i PATH=/usr/bin:/bin LANG=C.UTF-8 DOCKER_CONFIG="$case_dir/docker" \
            docker build --platform linux/arm64 --network default \
              --file tools/generator-context/Dockerfile --tag harmony-public-generator:unqualified \
              tools/generator-context > "$case_dir/build.private.log" 2>&1
          printf 'LOCAL_PUBLIC_GENERATOR_IMAGE_BUILT_NOT_QUALIFIED\n'
      - name: Probe actual public generator identity and owned container closure
        id: probe
        if: ${{ success() }}
        run: >-
          python3 -I -B -W error tools/generator_toolchain.py --phase probe
      - name: Publish the freshly probed public image with a scoped GitHub token
        id: publication
        if: ${{ success() && steps.probe.outcome == 'success' }}
        env:
          GHCR_GENERATOR_TOKEN: ${{ github.token }}
          GHCR_GENERATOR_ACTOR: ${{ github.actor }}
        run: python3 -I -B -W error tools/generator_toolchain.py --phase publish
      - name: Public immutable registry identity receipt only
        if: ${{ success() && steps.publication.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-generator-publication-${{ github.run_id }}
          path: |
            .generator-public/registry.json
            .generator-public/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      # Token is scoped to the publication process and its private Docker config.
      # No source SDK/key/decryption/provider login or raw diagnostics upload.
      # GitHub manages the build daemon; probe/publication CLI closure is separate.
